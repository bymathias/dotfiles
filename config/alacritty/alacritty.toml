
[env]
WINIT_X11_SCALE_FACTOR = "1"
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "none"
dynamic_padding = true

[window.padding]
x = 0
y = 0

[general]
# Import the Catppuccin theme (Mocha flavor for dark mode)
import = ["~/.config/alacritty/themes/catppuccin-mocha.toml"]
