[main]
font=monospace:size=14
dpi-aware=no # Let Sway handle scaling 
pad=10x10

[colors]
foreground=8A9394  # Pale grey for primary text
background=1C2526  # Deep charcoal grey for background
selection-foreground=1C2526
selection-background=727B7C  # Light ash grey for selection highlight

# ANSI colors (regular)
regular0=1C2526  # Black: Deep charcoal grey
regular1=596162  # Red: Muted steel grey (used as red for compatibility)
regular2=596162  # Green: Muted steel grey
regular3=596162  # Yellow: Muted steel grey
regular4=596162  # Blue: Muted steel grey
regular5=596162  # Magenta: Muted steel grey
regular6=596162  # Cyan: Muted steel grey
regular7=727B7C  # White: Light ash grey

# Bright ANSI colors
bright0=2E3536   # Bright black: Slate grey
bright1=727B7C   # Bright red: Light ash grey
bright2=727B7C   # Bright green: Light ash grey
bright3=727B7C   # Bright yellow: Light ash grey
bright4=727B7C   # Bright blue: Light ash grey
bright5=727B7C   # Bright magenta: Light ash grey
bright6=727B7C   # Bright cyan: Light ash grey
bright7=8A9394   # Bright white: Pale grey
